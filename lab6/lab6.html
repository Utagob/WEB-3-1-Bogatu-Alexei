<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    <link rel="stylesheet" href="lab6.css">
</head>
<body>
    <header class="d-flex align-items-center justify-content-space-between mx-5 my-2" style="justify-content: space-between;">
        <div class="d-flex align-items-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="60px" height="60px" viewBox="0 0 24 24">
            <path d="M4 4H3v1h2V2h1v20H5v-1H4v2h18V1H4zm3-2h14v20H7zM5 20H3v-1h1v-1h1zm0-6H3v-1h1v-1h1zm0-6H3V7h1V6h1zm0 
            3H3v-1h1V9h1zm0 6H3v-1h1v-1h1zm10.5-5h-3A3.504 3.504 0 0 0 9 15.5V18h10v-2.5a3.504 3.504 0 0 0-3.5-3.5zm2.5 
            5h-8v-1.5a2.503 2.503 0 0 1 2.5-2.5h3a2.503 2.503 0 0 1 2.5 2.5zm-4-6a3 3 0 1 0-3-3 3.003 3.003 0 0 0 3 
            3zm0-5a2 2 0 1 1-2 2 2.002 2.002 0 0 1 2-2z"/><path fill="none" d="M0 0h24v24H0z"/></svg>
            <p class="display-3 fst-italic">Catalog</p>
        </div>
        <a class="btn btn-primary" data-bs-toggle="offcanvas" href="#offcanvasAddStudent" role="button" aria-controls="offcanvasAddStudent">
            <i class="bi bi-person-plus"></i>
            </a>
    </header>

    <div class="content m-3 p-3 shadow-lg"></div>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasAddStudent" aria-labelledby="offcanvasAddStudentLabel">
        <div class="offcanvas-header d-flex justify-content-center">
            <p class="display-6 my-1">Adaugă un student</p>
        </div>
        <div class="offcanvas-body">
            <div class="offcanvas-form row d-flex justify-content-center my-2">
                <div class="col-lg-10">
                    <form class="offcanvas-form justify">
                        <label for="firstname" class="form-label">Prenume:</label>
                        <div id="firstnameDiv" class="">
                            <input class="form-control m-0 p-2" id="firstname" placeholder="e.g. Mario">
                            <p></p>
                        </div>

                        <label for="lastname" class="form-label">Nume:</label>
                        <div id="lastnameDiv">
                            <input class="form-control m-0 p-2" id="lastname" placeholder="e.g. Benieto">
                            <p></p>
                        </div>
                        
                        <label for="age" class="form-label">Vârsta:</label>
                        <div id="ageDiv">
                            <input type="number" class="form-control m-0 p-2" id="age" placeholder="e.g. 18">
                            <p></p>
                        </div>

                        <label for="class" class="form-label">Clasa:</label>
                        <div id="classDiv">
                            <input class="form-control m-0 p-2" id="class" placeholder="e.g. RTC-261">
                            <p></p>
                        </div>

                        <label for="email" class="form-label">Email-ul:</label>
                        <div id="emailDiv">
                            <div class="input-group">
                                <input type="email" class="form-control m-0 p-2" id="email" placeholder="e.g. mario@example.com">
                                <span class="input-group-text">@</span>
                            </div>
                            <p></p>
                        </div>

                        <div class="mt-4 text-center">
                            <button type="submit" class="btn btn-secondary" id="studentSubmit">Add</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasEditStudent" aria-labelledby="offcanvasEditStudentLabel">
        <div class="offcanvas-header d-flex justify-content-center">
            <p class="display-6 my-1">Pagina de editare:</p>
        </div>
        <div class="offcanvas-body">
            <div class="offcanvas-form row d-flex justify-content-center my-2">
                <div class="col-lg-10">
                    <form class="offcanvas-form justify">
                        <label for="firstnameEdit" class="form-label">Prenume:</label>
                        <div id="firstnameEditDiv" class="">
                            <input class="form-control m-0 p-2" id="firstnameEdit" placeholder="e.g. Mario">
                            <p></p>
                        </div>

                        <label for="lastnameEdit" class="form-label">Nume:</label>
                        <div id="lastnameEditDiv">
                            <input class="form-control m-0 p-2" id="lastnameEdit" placeholder="e.g. Benieto">
                            <p></p>
                        </div>
                        
                        <label for="ageEdit" class="form-label">Vârsta:</label>
                        <div id="ageEditDiv">
                            <input type="number" class="form-control m-0 p-2" id="ageEdit" placeholder="e.g. 18">
                            <p></p>
                        </div>

                        <label for="classEdit" class="form-label">Clasa:</label>
                        <div id="classEditDiv">
                            <input class="form-control m-0 p-2" id="classEdit" placeholder="e.g. RTC-261">
                            <p></p>
                        </div>

                        <label for="emailEdit" class="form-label">Email-ul:</label>
                        <div id="emailEditDiv">
                            <div class="input-group">
                                <input type="email" class="form-control m-0 p-2" id="emailEdit" placeholder="e.g. mario@example.com">
                                <span class="input-group-text">@</span>
                            </div>
                            <p></p>
                        </div>

                        <div class="mt-4 text-center">
                            <button type="submit" class="btn btn-secondary" id="studentEdit">Edit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>
    <script src="lab6.js"></script>
</body>
</html>
