<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="line1">
        <div class="select p">
            <p>Player</p>
            <img id="playerChoice" class="hidden" src="">
        </div>

        <div id="score"></div>

        <div class="select PC">    
            <p>PC</p>
            <img id="pcChoice" class="hidden" src="">
        </div>
    </div>

    <div id="line2">

        <div id="variants">
            <button class="choice rock"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1WahFz1L0K_7iz7KA_dpnNyHCBzrP9X0iyNd5xsDDVA&s=10"></button>
            <button class="choice paper"><img src="https://printworksmarket.com/cdn/shop/files/Printworks_refill-papper_white-large.jpg?v=1743596015"></button>
            <button class="choice scissors"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSkhNOoTgCMTwd1Sn_6GdfPBsaI9BJUIXmJwEcronxXA&s=10"></button>
        </div>

    </div>

    <p id="refText">refresh the page to restart the game</p>

    <script src="script.js"></script>
</body>
</html>
